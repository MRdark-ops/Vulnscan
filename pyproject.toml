[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner"
version = "1.2.0"
description = "Lightweight Web Vulnerability Scanner (SQLi + XSS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*"]
exclude = ["tests*", "reports*"]

[tool.setuptools.package-data]
scanner = ["payloads/*.txt", "payloads/*.json", "templates/*.html", "webapp/templates/*.html", "webapp/static/*"]
